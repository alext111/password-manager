# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name a-tran.dev www.a-tran.dev;

    # Let’s Encrypt ACME challenge path should not be redirected
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

}

# HTTPS server block
server {
    listen 443 ssl;
    server_name a-tran.dev www.a-tran.dev;

    # Paths to SSL certs
    ssl_certificate /etc/letsencrypt/live/a-tran.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a-tran.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend React app
    location / {
        root /usr/share/nginx/html;   # Docker frontend build output
        index index.html;
        try_files $uri /index.html;   # Single Page App fallback
    }

    # Backend reverse proxy for API
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

